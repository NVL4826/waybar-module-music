[package]
name = "waybar-module-music"
version = "0.5.0"
edition = "2021"
description = "MPD music module for Waybar"
license = "GPL-3.0-or-later"
repository = "https://github.com/Andeskjerf/waybar-module-music"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
panic = "abort"
rpath = true

[dependencies]
clap = { version = "4.5.54", features = ["derive", "env"] }
dirs = "6.0.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
simplelog = "0.12.2"

